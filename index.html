<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دفتر العهدة والعمالة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&family=Tajawal:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{
  --bg:#F2EBDD; --paper:#FBF6EC; --paper-soft:#F6EFE1;
  --ink:#2B2520; --ink-soft:#6B5F4F;
  --line:#CBB996; --line-soft:#E2D6BB;
  --accent:#D9622B; --accent-ink:#7A3413; --accent-soft:#F3DCC9;
  --green:#1F5C4D; --green-soft:#DCE9DF;
  --red:#B23A2E; --red-soft:#F4DCD8;
  --gold:#B68A35;
  --display:'Cairo',sans-serif; --body:'Tajawal',sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  background-image:linear-gradient(var(--line-soft) 1px, transparent 1px);
  background-size:100% 38px;background-attachment:local;
}
#app{max-width:1080px;margin:0 auto;padding:18px 18px 60px;}
button{font-family:var(--body);cursor:pointer;}
input,select{font-family:var(--body);}

.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:3px double var(--line);padding-bottom:14px;margin-bottom:18px;}
.brand{display:flex;align-items:center;gap:14px;}
.brand-stamp{width:54px;height:54px;border-radius:50%;border:2px solid var(--accent-ink);display:flex;align-items:center;justify-content:center;transform:rotate(-9deg);font-family:var(--display);font-weight:900;font-size:13px;color:var(--accent-ink);position:relative;flex-shrink:0;}
.brand-stamp::after{content:"";position:absolute;inset:5px;border:1px solid var(--accent-ink);border-radius:50%;opacity:.55;}
.brand h1{font-family:var(--display);font-weight:900;font-size:22px;margin:0;color:var(--ink);letter-spacing:.3px;}
.brand p{margin:2px 0 0;color:var(--ink-soft);font-size:13px;}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.who .uname{font-size:13px;color:var(--ink-soft);}
.who .uname b{color:var(--ink);}
.linklike{border:none;background:none;color:var(--accent-ink);font-size:12.5px;text-decoration:underline;padding:0;}
#saveStatus{font-size:11.5px;color:var(--ink-soft);font-family:var(--mono);}

.chip-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px;}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:7px 16px;font-size:13.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--line);}
.chip.active{border-color:var(--accent-ink);color:var(--accent-ink);background:var(--accent-soft);font-weight:700;}
.chip.active .dot{background:var(--accent-ink);}
.add-chip-btn,.export-btn{border:1px dashed var(--ink-soft);background:transparent;border-radius:20px;padding:7px 14px;font-size:13.5px;color:var(--ink-soft);}
.add-chip-btn:hover{border-color:var(--accent-ink);color:var(--accent-ink);}
.export-btn{margin-right:auto;border:1px solid var(--green);color:var(--green);border-radius:8px;background:var(--paper);font-weight:700;display:flex;align-items:center;gap:6px;}
.export-btn:disabled{opacity:.5;cursor:default;}
.inline-add-form{display:flex;gap:6px;align-items:center;}
.inline-add-form input{border:1px solid var(--accent-ink);border-radius:20px;padding:6px 12px;font-size:13px;width:160px;}
.inline-add-form button{border:none;background:var(--accent);color:#fff;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;}

.tabs{display:flex;gap:4px;margin:22px 0 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.tab{background:transparent;border:none;padding:10px 18px;font-size:14.5px;color:var(--ink-soft);font-weight:700;font-family:var(--display);border-bottom:3px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--accent-ink);border-bottom-color:var(--accent);}
.tabpanel{display:none;}
.tabpanel.active{display:block;}

.card{background:var(--paper);border:1px solid var(--line-soft);border-radius:10px;padding:18px 20px;margin-bottom:18px;}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.card-head h3{margin:0;font-family:var(--display);font-size:15.5px;color:var(--ink);}
.muted{color:var(--ink-soft);font-size:12.5px;}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state h2{font-family:var(--display);color:var(--ink);font-size:19px;margin-bottom:8px;}

.auth-wrap{max-width:380px;margin:40px auto;}
.auth-card{background:var(--paper);border:1px solid var(--line-soft);border-radius:12px;padding:26px 24px;}
.auth-card h2{font-family:var(--display);font-size:18px;margin:0 0 4px;}
.auth-card p.hint{color:var(--ink-soft);font-size:12.5px;margin:0 0 18px;}
.auth-card form{display:flex;flex-direction:column;gap:10px;}
.auth-card input{border:1px solid var(--line);border-radius:7px;padding:10px 12px;font-size:14px;width:100%;}
.auth-card button[type=submit]{border:none;background:var(--accent);color:#fff;border-radius:7px;padding:10px;font-size:14.5px;font-weight:700;margin-top:6px;}
.auth-switch{text-align:center;margin-top:14px;font-size:13px;color:var(--ink-soft);}
.security-note{margin-top:16px;font-size:11.5px;color:var(--ink-soft);background:var(--paper-soft);border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;}

.custody-grid{display:grid;grid-template-columns:240px 1fr;gap:20px;margin-bottom:18px;align-items:start;}
@media (max-width:760px){.custody-grid{grid-template-columns:1fr;}}
.tape{background:var(--paper);border:1px solid var(--line);border-radius:4px 4px 0 0;padding:18px 16px 14px;font-family:var(--mono);position:relative;}
.tape::after{content:"";display:block;position:absolute;left:0;right:0;bottom:-12px;height:12px;background:linear-gradient(135deg,var(--paper) 50%,transparent 50%) 0 0/12px 12px repeat-x,linear-gradient(45deg,var(--paper) 50%,transparent 50%) 0 0/12px 12px repeat-x;}
.tape-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--ink-soft);}
.tape-row span:last-child{font-weight:600;color:var(--ink);}
.tape-divider{border-top:1px dashed var(--line);margin:8px 0;}
.tape-row.total{font-size:16px;padding-top:2px;}
.tape-row.total span:last-child{font-size:20px;font-weight:700;}
.tape-row.total.pos span:last-child{color:var(--green);}
.tape-row.total.neg span:last-child{color:var(--red);}

.custody-forms{display:flex;flex-direction:column;gap:14px;}
.form-card{background:var(--paper-soft);border:1px solid var(--line-soft);border-radius:8px;padding:14px 16px;}
.form-card.alert-form{border-color:var(--red-soft);background:#FBF1EE;}
.form-card h3{margin:0 0 6px;font-size:13.5px;font-family:var(--display);color:var(--ink);}
.form-card .hint{margin:0 0 10px;font-size:12px;color:var(--ink-soft);}
.form-card form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.form-card input,.form-card select{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13.5px;background:#fff;color:var(--ink);}
.form-card input[type=date]{width:135px;}
.form-card input[type=number]{width:110px;}
.form-card input[type=text]{flex:1;min-width:140px;}
.form-card select[name=projectId]{min-width:150px;}
.form-card button{border:none;border-radius:6px;padding:8px 16px;font-size:13.5px;font-weight:700;color:#fff;background:var(--accent);}
.form-card.alert-form button{background:var(--red);}
.proj-add-mini{display:flex;gap:6px;align-items:center;margin-top:6px;}
.proj-add-mini input{flex:1;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12.5px;}
.proj-add-mini button{border:1px solid var(--accent-ink);background:#fff;color:var(--accent-ink);border-radius:6px;padding:6px 10px;font-size:12px;}
@media (max-width:560px){
  .form-card form{flex-direction:column;align-items:stretch;}
  .form-card input[type=date],.form-card input[type=number],.form-card input[type=text],.form-card select,.form-card button{width:100%;min-width:0;}
}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:right;font-family:var(--display);font-weight:700;font-size:12px;color:var(--ink-soft);border-bottom:1px solid var(--line);padding:8px 8px;white-space:nowrap;}
td{padding:8px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle;white-space:nowrap;}
tr:hover td{background:var(--paper-soft);}
.num{font-family:var(--mono);}
.amt-in{color:var(--green);font-family:var(--mono);}
.amt-out{color:var(--red);font-family:var(--mono);}
.del-btn{border:none;background:transparent;color:var(--red);font-size:12px;border:1px solid var(--red-soft);border-radius:5px;padding:3px 8px;}
.small-btn{border:1px solid var(--line);background:#fff;border-radius:5px;padding:3px 9px;font-size:12px;color:var(--ink-soft);}

.week-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.week-row input[type=date]{border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13.5px;}
.week-label{font-family:var(--mono);font-size:13px;color:var(--ink-soft);}

.worker-row input,.worker-row select{border:1px solid var(--line-soft);border-radius:5px;padding:5px 7px;font-size:13px;background:#fff;width:100%;}
.archived-toggle{font-size:12.5px;color:var(--ink-soft);background:none;border:none;text-decoration:underline;padding:0;margin-top:6px;}

.day-cell{text-align:center;}
.day-stamp{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:transparent;}
.day-stamp.present{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700;}
.ot-input{width:46px;border:1px solid var(--line-soft);border-radius:4px;padding:2px 3px;font-size:11px;text-align:center;display:block;margin:3px auto 0;}
.transport-input{width:60px;border:1px solid var(--gold);border-radius:4px;padding:3px 4px;font-size:12px;text-align:center;}
.day-col-head{text-align:center;}
.total-col{font-weight:700;color:var(--accent-ink);}
.foot-row td{font-weight:700;border-top:2px solid var(--line);border-bottom:none;background:var(--paper-soft);}
.transport-row td{background:#FAF3E3;border-top:1px dashed var(--gold);}

.week-nav{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.week-nav-btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:700;color:var(--accent-ink);}
.week-nav-btn:hover{background:var(--accent-soft);}
.week-display{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;}
.week-range{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--ink);}
.week-nav input[type=date]{margin-top:4px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;}

.file-mini-label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--ink-soft);}
.file-mini-label input[type=file]{font-size:11px;width:200px;}
.attach-link{font-size:12px;color:var(--accent-ink);text-decoration:underline;}
.attach-thumb{width:34px;height:34px;object-fit:cover;border-radius:5px;border:1px solid var(--line);vertical-align:middle;}

#voucherOverlay{position:fixed;inset:0;background:rgba(43,37,32,.55);z-index:10001;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 14px;}
#voucherInner{width:100%;max-width:820px;}
.voucher-page{background:#fff;color:#222;border-radius:6px;padding:24px 28px;font-family:var(--body);box-shadow:0 8px 30px rgba(0,0,0,.35);margin-bottom:20px;}
.v-head{text-align:center;border-bottom:2.5px solid #333;padding-bottom:12px;margin-bottom:14px;}
.v-company{font-family:var(--display);font-weight:900;font-size:22px;}
.v-title{font-size:16px;margin-top:4px;font-weight:700;color:#444;}
.v-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;margin-top:10px;font-size:12px;color:#555;border-top:1px solid #eee;padding-top:8px;}
.v-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px;}
.v-table th{background:#f5f5f5;padding:7px 4px;border:1px solid #ccc;text-align:center;font-family:var(--display);font-size:11.5px;white-space:nowrap;}
.v-table td{padding:9px 4px;border:1px solid #ddd;vertical-align:middle;}
.v-table td.tc{text-align:center;}
.v-table .v-total-row td{border-top:2.5px double #333;font-size:13.5px;background:#f9f9f9;font-weight:800;}
.v-table .v-transport-row td{background:#faf3e3;font-size:12.5px;}
.v-footer{display:flex;justify-content:space-around;margin-top:28px;padding-top:16px;border-top:1px solid #ddd;}
.v-sign-box{text-align:center;width:28%;}
.v-sign-line{border-bottom:1.5px solid #333;margin-bottom:8px;height:40px;}
.v-sign-label{font-size:12px;color:#555;font-family:var(--display);}
.v-page-num{text-align:center;margin-top:10px;font-size:11px;color:#999;}
.voucher-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;padding-bottom:20px;flex-wrap:wrap;}
.voucher-actions button{border:none;border-radius:7px;padding:9px 20px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:var(--body);}
.voucher-print-btn{background:var(--accent);color:#fff;}
.voucher-pdf-btn{background:var(--green);color:#fff;}
.voucher-close-btn{background:#eee;color:#333;}
.idproof-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px;}
.idproof-cell{border:1px solid #ddd;border-radius:6px;padding:10px;text-align:center;}
.idproof-name{font-family:var(--display);font-weight:700;font-size:13px;margin-bottom:8px;color:#333;}
.idproof-img{width:100%;max-height:230px;object-fit:contain;border-radius:4px;border:1px solid #eee;}
.idproof-no-img{height:200px;display:flex;align-items:center;justify-content:center;font-size:13px;background:#f9f9f9;border-radius:4px;border:1px dashed #ccc;}
@media print{
  @page{size:A4 portrait;margin:1.2cm;}
  body>*:not(#voucherOverlay):not(#receiptsOverlay){display:none!important;}
  #voucherOverlay,#receiptsOverlay{position:static!important;background:transparent!important;padding:0!important;display:block!important;overflow:visible!important;}
  #voucherInner,#receiptsInner{max-width:100%;}
  .voucher-page,#receiptsInner .rp-page{box-shadow:none!important;border-radius:0!important;padding:0.5cm 0!important;margin:0!important;page-break-after:always;}
  .voucher-page:last-of-type,#receiptsInner .rp-page:last-of-type{page-break-after:avoid;}
  .voucher-actions,#receiptsInner .voucher-actions{display:none!important;}
  .rp-img{max-height:220mm;}
}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 2px 12px rgba(0,0,0,.3);z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center;}
.rp-page{background:#fff;border-radius:6px;padding:20px 24px;box-shadow:0 4px 20px rgba(0,0,0,.25);margin-bottom:18px;}
.rp-header{text-align:center;border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:14px;}
.rp-company{font-family:var(--display);font-weight:900;font-size:18px;}
.rp-custody{font-size:13px;color:#555;margin-top:4px;}
.rp-meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;background:#f8f8f8;border-radius:6px;padding:10px 12px;margin-bottom:14px;}
.rp-meta span{color:#444;}
.rp-meta b{color:#222;}
.rp-img-wrap{text-align:center;}
.rp-img{max-width:100%;max-height:600px;object-fit:contain;border:1px solid #ddd;border-radius:4px;}
.rp-pdf-link{padding:40px;background:#f5f5f5;border-radius:6px;font-size:16px;text-align:center;}
.rp-pdf-link a{color:var(--accent-ink);text-decoration:none;font-weight:700;}
.rp-section-label{font-family:var(--display);font-weight:700;font-size:13px;color:var(--ink-soft);margin-bottom:8px;padding:6px 10px;background:#f5f5f5;border-radius:5px;border-right:3px solid var(--accent);}
.rp-break{page-break-before:always;}
#saveFailBanner{position:fixed;top:0;left:0;right:0;background:var(--red);color:#fff;padding:10px 16px;text-align:center;font-size:13px;z-index:10000;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;}
#saveFailBanner button{border:1px solid #fff;background:transparent;color:#fff;border-radius:5px;padding:4px 10px;font-size:12.5px;}
/* ============= وضع القراءة فقط (Admin) ============= */
#app.readonly-mode .form-card,
#app.readonly-mode .custody-forms,
#app.readonly-mode .proj-add-mini,
#app.readonly-mode #poolWorkerForm,
#app.readonly-mode .archived-toggle,
#app.readonly-mode #archivedBox,
#app.readonly-mode [data-delcustody],
#app.readonly-mode .del-btn,
#app.readonly-mode [data-archive],
#app.readonly-mode [data-removeworker],
#app.readonly-mode [data-restore]{display:none!important;}
/* الأعمدة الأخيرة في جداول العمال (زراير الأرشفة/الإزالة) */
#app.readonly-mode .worker-row td:last-child{display:none!important;}
/* إخفاء الحقول القابلة للتعديل في جداول العمال */
#app.readonly-mode .worker-row input,
#app.readonly-mode .worker-row select{pointer-events:none;background:transparent;border-color:transparent;color:var(--ink);}
/* إخفاء زرار إضافة عهدة جديدة */
#app.readonly-mode #newCustodyBtn{display:none!important;}
/* إخفاء زراير إضافة شركات ومشاريع في الشريط العلوي */
#app.readonly-mode .add-chip-btn:not(#backToCompanies):not(#backToMainBtn):not(#backToLedgerMain):not(#refreshDataBtn){display:none!important;}
/* زرار رفع إثبات الشخصية */
#app.readonly-mode label[style*="cursor:pointer"]{display:none!important;}

/* قفل جدول الحضور كاملاً في وضع القراءة فقط */
#app.readonly-mode .day-stamp{pointer-events:none;cursor:default;}
#app.readonly-mode .ot-input,
#app.readonly-mode .transport-input,
#app.readonly-mode input[type="number"],
#app.readonly-mode input[type="text"],
#app.readonly-mode input[type="date"],
#app.readonly-mode select{pointer-events:none;cursor:default;background:transparent;border-color:transparent;}
#app.readonly-mode button[type="submit"]{display:none!important;}
/* السماح بالتفاعل مع زراير التصدير والتنقل فقط */
#app.readonly-mode .export-btn,
#app.readonly-mode .voucher-print-btn,
#app.readonly-mode .voucher-pdf-btn,
#app.readonly-mode .voucher-close-btn,
#app.readonly-mode .add-chip-btn[id="backToCompanies"],
#app.readonly-mode .add-chip-btn[id="backToMainBtn"],
#app.readonly-mode .add-chip-btn[id="backToLedgerMain"],
#app.readonly-mode .add-chip-btn[id="refreshDataBtn"],
#app.readonly-mode .chip,
#app.readonly-mode [data-opencustody],
#app.readonly-mode [data-openbook],
#app.readonly-mode [data-singlevoucher],
#app.readonly-mode [data-singleidproof],
#app.readonly-mode #voucherBtn,
#app.readonly-mode #idProofAllBtn,
#app.readonly-mode #exportBookBtn,
#app.readonly-mode #exportLedgerBtn,
#app.readonly-mode #exportReceiptsPdfBtn,
#app.readonly-mode #nextWeekBtn,
#app.readonly-mode #prevWeekBtn,
#app.readonly-mode .week-nav-btn{pointer-events:auto!important;cursor:pointer!important;}

#adminViewBanner{position:fixed;top:0;left:0;right:0;background:var(--gold);color:#2B2520;padding:9px 16px;text-align:center;font-size:13px;z-index:9998;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;font-weight:700;}
#adminViewBanner button{border:1px solid #2B2520;background:transparent;color:#2B2520;border-radius:5px;padding:4px 10px;font-size:12.5px;font-weight:700;}
</style>
</head>

const CLOUDINARY_CLOUD_NAME = "dla6hdrk7";
const CLOUDINARY_UPLOAD_PRESET = "invoices";
const storageReady = CLOUDINARY_CLOUD_NAME.indexOf('ضع_')!==0 && CLOUDINARY_UPLOAD_PRESET.indexOf('ضع_')!==0;

async function uploadFile(file,path){
  if(!storageReady)throw new Error('Cloudinary not configured');
  const formData=new FormData();
  formData.append('file',file);
  formData.append('upload_preset',CLOUDINARY_UPLOAD_PRESET);
  formData.append('folder',path);
  const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`,{method:'POST',body:formData});
  if(!res.ok)throw new Error('Cloudinary upload failed: '+res.status);
  const data=await res.json();
  return data.secure_url;
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function toISO(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day;}
function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function weekStartOf(dateStr){const d=parseISO(dateStr);const dow=d.getDay();const offset=(dow+1)%7;d.setDate(d.getDate()-offset);return toISO(d);}
function weekDates(weekStartStr){const start=parseISO(weekStartStr);return DAYS.map((_,i)=>{const dt=new Date(start);dt.setDate(start.getDate()+i);return toISO(dt);});}
function getDaysInRange(startDate,endDate){
  const days=[];let cur=parseISO(startDate);const end=parseISO(endDate);
  while(toISO(cur)<=endDate){days.push(toISO(cur));cur=new Date(cur);cur.setDate(cur.getDate()+1);}
  return days;
}
const DAY_NAMES_AR=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function getDayLabel(dateStr){return DAY_NAMES_AR[parseISO(dateStr).getDay()];}
function fmtDayShort(dateStr){const d=parseISO(dateStr);return (d.getDate())+'/'+(d.getMonth()+1);}
function fmt(n){return (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtDate(s){if(!s)return'';const d=parseISO(s);return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

let pendingRetry=null;
function showSaveFailureBanner(key,value,shared){

  document.getElementById('retrySaveBtn').addEventListener('click',async()=>{
    if(!pendingRetry)return;
    const {key,value,shared}=pendingRetry;
    await sSet(key,value,shared);
  });
}

}

/* ====================================================================
   حساب المدير الرئيسي: بعد ما تسجّل حسابك الرئيسي، روح لـ Firebase Console
   → Authentication → Users، انسخ الـ UID بتاعت حسابك، واستبدل القيمة دي بيه.
   ==================================================================== */
const ADMIN_USERNAME='admin';

function userKvRef(key){
  const uidToUse=state.viewAsUid||state.currentUser.uid;
  return db.collection('users').doc(uidToUse).collection('kv').doc(key);
}
async function sGet(key,shared){
  if(!shared){
    try{const v=localStorage.getItem('local_'+key);return v?JSON.parse(v):null;}
    catch(e){return null;}
  }
  if(!firebaseReady||!state.currentUser)return null;
  try{
    const snap=await userKvRef(key).get();
    if(!snap.exists)return null;
    const data=snap.data();
    return (data&&data.value!==undefined)?JSON.parse(data.value):null;
  }catch(e){return null;}
}
async function sSet(key,value,shared,attempt){
  if(!shared){
    try{
      localStorage.setItem('local_'+key,JSON.stringify(value));
      markSaved();hideSaveFailureBanner();
      return true;
    }catch(e){console.error(e);showSaveFailureBanner(key,value,shared);return false;}
  }
  attempt=attempt||0;
  if(!firebaseReady||!state.currentUser){showSaveFailureBanner(key,value,shared);return false;}
  try{
    await userKvRef(key).set({value:JSON.stringify(value),updatedAt:Date.now()});
    markSaved();
    hideSaveFailureBanner();
    return true;
  }catch(e){
    if(attempt<2){
      await new Promise(res=>setTimeout(res,500));
      return sSet(key,value,shared,attempt+1);
    }
    console.error('SAVE FAILED',key,e);
    showSaveFailureBanner(key,value,shared);
    return false;
  }
}

function usernameToEmail(u){return u.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'')+'@ledgerapp.local';}
function emailToUsername(email){return (email||'').split('@')[0];}

async function init(){
  if(!firebaseReady){
    renderSetupNeeded();
    return;
  }
  firebase.auth().onAuthStateChanged(async(user)=>{
    if(user){
      const username=emailToUsername(user.email);
      const name=user.displayName||username;
      state.currentUser={uid:user.uid,username,name};
      state.companies=(await sGet('companies',true))||[];
      const lastCompany=await sGet('last_company',false);
      if(lastCompany&&state.companies.find(c=>c.id===lastCompany)){
        await loadCompany(lastCompany);
      }
      /* تسجيل الحساب في registry تلقائياً عند كل دخول (يضمن ظهوره في لوحة الإدارة) */
      if(firebaseReady){
        try{
          await db.collection('registry').doc(user.uid).set(
            {uid:user.uid,username,name,lastSeen:Date.now()},
            {merge:true}
          );
        }catch(e){console.warn('registry auto-write failed',e);}
      }
    }else{
      state.currentUser=null;
      state.currentCompanyId=null;
    }
    await renderRoot();
  });
}

async function submitLogin(e){
  e.preventDefault();
  const f=e.target;
  const username=f.username.value.trim();
  const password=f.password.value;
  if(!username||!password)return;
  try{
    await firebase.auth().signInWithEmailAndPassword(usernameToEmail(username),password);
    /* onAuthStateChanged بيكمل الباقي تلقائي */
  }catch(err){
    showToast('اسم المستخدم أو كلمة المرور غير صحيحة');
  }
}

async function submitRegister(e){
  e.preventDefault();
  const f=e.target;
  const name=f.name.value.trim();
  const username=f.username.value.trim();
  const password=f.password.value;
  if(!name||!username||!password)return;
  try{
    const cred=await firebase.auth().createUserWithEmailAndPassword(usernameToEmail(username),password);
    await cred.user.updateProfile({displayName:name});
    state.currentUser={uid:cred.user.uid,username,name};
    await renderRoot();
    try{
      await db.collection('registry').doc(cred.user.uid).set({uid:cred.user.uid,username,name,createdAt:Date.now()});
    }catch(regErr){console.error('registry write failed',regErr);}
  }catch(err){
    if(err.code==='auth/email-already-in-use'){showToast('اسم المستخدم ده محجوز، اختار اسم تاني');}
    else if(err.code==='auth/weak-password'){showToast('كلمة المرور لازم تكون 6 حروف/أرقام على الأقل');}
    else{showToast('حصل خطأ، حاول تاني');console.error(err);}
  }
}

    state.ledger={entries:[]};
    state.poolWorkers=[];
    state.dayBooks=[];
  }else{
    state.projects=(await sGet('projects:'+companyId,true))||[];
    state.custodies=(await sGet('custodies:'+companyId,true))||[];
    state.poolWorkers=(await sGet('pool_workers:'+companyId,true))||[];

  state.currentCustodyId=null;
  state.ledger={entries:[]};
  state.currentProjectId=state.projects.length?state.projects[0].id:null;
  state.currentBookId=null;
  state.bookWorkers=[];
  state.dayBooks=[];
  state.currentTab='ledger';

}

async function saveLedgerAndUpdateBalance(){

  /* تحديث الرصيد المخزّن في بيانات العهدة */
  const c=state.custodies.find(x=>x.id===state.currentCustodyId);
  if(c){

    c.totalIn=totalIn;c.totalOut=totalOut;
    await sSet('custodies:'+state.currentCompanyId,state.custodies,true);
  }
}

async function loadProjectWorkforce(projectId){
  state.currentProjectId=projectId;
  state.currentBookId=null;
  state.bookWorkers=[];
  if(!projectId){state.dayBooks=[];state.attendance={};return;}
  state.dayBooks=(await sGet('daybooks:'+state.currentCompanyId+':'+projectId,true))||[];
  state.attendance={};
}

/* === الحضور بالتاريخ الفعلي === */
function getDatesInRange(startDate,endDate){
  const dates=[];
  const end=parseISO(endDate);
  const cur=parseISO(startDate);
  while(cur<=end){dates.push(toISO(new Date(cur)));cur.setDate(cur.getDate()+1);}
  return dates;
}

function getDayLabel(dateISO){
  const names=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  return names[parseISO(dateISO).getDay()];
}

function attKey(){
  return 'att2:'+state.currentCompanyId+':'+state.currentProjectId+':'+state.currentBookId;
}

async function loadBook(bookId){
  state.currentBookId=bookId;
  const book=state.dayBooks.find(b=>b.id===bookId);
  if(!book){state.bookWorkers=[];state.attendance={};return;}
  state.bookWorkers=(await sGet('book_workers:'+state.currentCompanyId+':'+state.currentProjectId+':'+bookId,true))||[];
  state.attendance=(await sGet(attKey(),true))||{};
}

async function saveAttendance(){
  await sSet(attKey(),state.attendance,true);
}

/* ====== مساعدات الحضور القائم على التاريخ ====== */
function getWorkerDay(wid,date){
  return (state.attendance[wid]&&state.attendance[wid][date])||{present:false,ot:0};
}
function setWorkerDay(wid,date,data){
  if(!state.attendance[wid])state.attendance[wid]={};
  state.attendance[wid][date]=data;
}
function getTransportForDate(date){
  return (state.attendance.__transport&&state.attendance.__transport[date])||0;
}
function workerBookTotals(worker,dates){
  let daysWorked=0,otTotal=0;
  dates.forEach(date=>{
    const d=getWorkerDay(worker.id,date);
    if(d.present)daysWorked++;
    otTotal+=(d.ot||0);
  });
  const hourlyRate=worker.wage/STD_HOURS;
  return {daysWorked,otTotal,total:daysWorked*worker.wage+otTotal*hourlyRate,hourlyRate};
}

function renderLedgerTable(){
  const tbody=document.getElementById('ledgerTbody');
  if(!tbody)return;

  /* قراءة قيم الفلتر */
  const textQ=(document.getElementById('filterText')?.value||'').trim().toLowerCase();
  const typeQ=document.getElementById('filterType')?.value||'';
  const fromQ=document.getElementById('filterFrom')?.value||'';
  const toQ=document.getElementById('filterTo')?.value||'';

  const sorted=[...state.ledger.entries].sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);

  /* تطبيق الفلاتر */
  const filtered=sorted.filter(e=>{
    if(textQ){
      const proj=state.projects.find(p=>p.id===e.projectId);
      const hay=((e.note||'')+(proj?.name||'')+(e.workerName||'')).toLowerCase();
      if(!hay.includes(textQ))return false;
    }
    if(typeQ){
      if(typeQ==='in'&&e.type!=='in')return false;
      if(typeQ==='invoice'&&(e.type!=='out'||e.entryType==='worker_wage'))return false;
      if(typeQ==='worker_wage'&&e.entryType!=='worker_wage')return false;
    }
    if(fromQ&&e.date<fromQ)return false;
    if(toQ&&e.date>toQ)return false;
    return true;
  });

  /* الرصيد يُحسب على الكل (مش المُفلتَر) */
  let running=0;
  const runningMap={};
  sorted.forEach(e=>{running+=e.type==='in'?e.amount:-e.amount;runningMap[e.id]=running;});

  /* تحديث عداد النتائج */
  const countEl=document.getElementById('ledgerCount');
  if(countEl)countEl.textContent=filtered.length===sorted.length
    ?`${sorted.length} حركة`
    :`${filtered.length} من ${sorted.length} حركة`;

  const rowsHtml=[...filtered].reverse().map(e=>{
    const proj=state.projects.find(p=>p.id===e.projectId);
    const typeLabel=e.type==='in'?'استلام عهدة':e.entryType==='worker_wage'?'👷 يومية عامل':'📄 فاتورة';
    return `<tr>
      <td class="num">${fmtDate(e.date)}</td>
      <td>${typeLabel}</td>
      <td class="muted">${proj?escapeHtml(proj.name):e.workerName?escapeHtml(e.workerName):'-'}</td>
      <td>${escapeHtml(e.note||'-')}</td>
      <td class="num muted">${e.qty!=null?e.qty:'-'}</td>
      <td class="num muted">${e.unitPrice!=null?fmt(e.unitPrice):'-'}</td>
      <td class="${e.type==='in'?'amt-in':'amt-out'}">${e.type==='in'?'+':'-'}${fmt(e.amount)}</td>
      <td class="num">${fmt(runningMap[e.id]||0)}</td>
      <td class="muted">${escapeHtml(e.by||'-')}</td>
      <td>${(()=>{const imgs=getEntryImages(e);const viewBtn=imgs.length===0?'<span class="muted">-</span>':imgs.length===1?(imgs[0].match(/\.(pdf)(\?|$)/i)?`<a class="attach-link" href="${imgs[0]}" target="_blank">📄 PDF</a>`:`<a class="attach-link" href="${imgs[0]}" target="_blank">عرض</a>`):`<button class="attach-link" style="border:none;background:none;cursor:pointer;" data-gallery="${escapeHtml(JSON.stringify(imgs))}" data-gallery-title="${escapeHtml(e.note||'')}">📷 عرض (${imgs.length})</button>`;const addBtn=e.type==='out'&&!state.isReadOnly?`<label style="cursor:pointer;font-size:11px;color:var(--green);text-decoration:underline;margin-right:6px;">+صورة<input type="file" accept="image/*,.pdf" multiple style="display:none;" data-addimg="${e.id}"></label>`:'';return addBtn+viewBtn;})()}</td>
      <td><button class="del-btn" data-del="${e.id}">حذف</button></td>
    </tr>`;
  }).join('');

  tbody.innerHTML=rowsHtml||`<tr><td colspan="11" class="muted" style="text-align:center;padding:18px;">${filtered.length===0&&sorted.length>0?'لا توجد نتائج تطابق البحث':'لسه مفيش حركات مسجّلة'}</td></tr>`;

  /* gallery viewer */
  tbody.querySelectorAll('[data-gallery]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      try{const imgs=JSON.parse(btn.dataset.gallery);showImageGallery(imgs,btn.dataset.galleryTitle||'');}
      catch(err){console.error(err);}
    });
  });

  /* إضافة صورة لحركة موجودة */
  tbody.querySelectorAll('[data-addimg]').forEach(inp=>{
    inp.addEventListener('change',async()=>{
      const files=Array.from(inp.files);if(!files.length)return;
      const eid=inp.dataset.addimg;
      const entry=state.ledger.entries.find(x=>x.id===eid);if(!entry)return;
      if(!storageReady){showToast('تخزين الصور (Cloudinary) غير متفعّل');return;}
      showToast('جاري رفع '+files.length+' صورة...');
      try{
        const existing=getEntryImages(entry);
        const newUrls=await Promise.all(files.map((file,fi)=>{
          const path='users/'+state.currentUser.uid+'/invoices/'+eid+'-extra-'+fi+'-'+Date.now();
          return uploadFile(file,path);
        }));
        entry.imageUrls=[...existing,...newUrls];
        delete entry.imageUrl;
        renderLedgerTable();
        await saveLedgerAndUpdateBalance();
        showToast('تم إضافة '+newUrls.length+' صورة ✓');
      }catch(err){console.error(err);showToast('فشل رفع الصور');}
    });
  });

  tbody.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      if(!confirm('متأكد من حذف هذه الحركة؟'))return;
      state.ledger.entries=state.ledger.entries.filter(e=>e.id!==btn.dataset.del);
      renderLedgerTable();
      await saveLedgerAndUpdateBalance();
    });
  });
}

async function submitLedger(e,type){
  e.preventDefault();
  const f=e.target;
  let amount=0;
  let qty=null,unitPrice=null;
  if(type==='in'){
    amount=parseFloat(f.amount?.value)||0;
  }else{
    qty=parseFloat(f.qty?.value)||0;
    unitPrice=parseFloat(f.unitPrice?.value)||0;
    amount=qty*unitPrice;
  }
  if(amount<=0)return;
  if(type==='out'&&!f.projectId.value){showToast('اختار مشروع للمصروف أولاً');return;}

  const entryType=f.entryType?.value||'invoice';
  let workerId=null,workerName=null,workerIdProofUrl=null;
  if(type==='out'&&entryType==='worker_wage'){
    workerId=f.workerId?.value||null;
    if(!workerId){showToast('اختار العامل أولاً');return;}
    const worker=state.poolWorkers.find(w=>w.id===workerId);
    if(worker){
      workerName=worker.name;
      workerIdProofUrl=worker.idProofUrl||null;
    }
  }

  const files=type==='out'?Array.from(f.invoiceImage?.files||[]):[];
  const noteVal=f.note?.value.trim()||(workerName?'يومية: '+workerName:'');
  const entry={
    id:uid(),type,date:f.date.value,amount,
    note:noteVal,
    projectId:type==='out'?f.projectId.value:undefined,
    entryType:type==='out'?entryType:undefined,
    workerId:workerId||undefined,
    workerName:workerName||undefined,
    workerIdProofUrl:workerIdProofUrl||undefined,
    qty:qty||undefined,
    unitPrice:unitPrice||undefined,
    by:state.currentUser.name,createdAt:Date.now()
  };
  state.ledger.entries.push(entry);
  f.reset();f.date.value=toISO(new Date());
  document.getElementById('outWorkerSelect')&&(document.getElementById('outWorkerSelect').style.display='none');
  const tot=document.getElementById('outTotal');if(tot)tot.textContent='0.00';
  renderLedgerDetail();
  await saveLedgerAndUpdateBalance();
  if(files.length){
    if(!storageReady){showToast('الحركة اتسجلت، لكن تخزين الصور (Cloudinary) مش متفعّل');}
    else{
      showToast('جاري رفع '+files.length+' صورة...');
      try{
        const urls=await Promise.all(files.map((file,fi)=>{
          const path='users/'+state.currentUser.uid+'/invoices/'+entry.id+'-'+fi+'-'+Date.now()+'-'+file.name;
          return uploadFile(file,path);
        }));
        entry.imageUrls=urls;
        renderLedgerTable();
        await saveLedgerAndUpdateBalance();
        showToast('تم رفع '+urls.length+' صورة بنجاح ✓');
      }catch(err){console.error(err);showToast('الحركة اتسجلت، لكن فشل رفع بعض الصور');}
    }
  }
}

async function exportLedgerReport(){
  const btn=document.getElementById('exportLedgerBtn');
  if(btn){btn.disabled=true;btn.innerHTML='<span>...</span> جاري التصدير';}
  try{
    const company=state.companies.find(c=>c.id===state.currentCompanyId);
    const custody=state.custodies.find(c=>c.id===state.currentCustodyId);

    /* مصروفات فقط مرتبة بالتاريخ */
    const outEntries=[...state.ledger.entries]
      .filter(e=>e.type==='out')
      .sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);
    const totalIn=state.ledger.entries.filter(e=>e.type==='in').reduce((s,e)=>s+e.amount,0);

    const wb=XLSX.utils.book_new();
    const ws={};
    const ec=(r,c)=>XLSX.utils.encode_cell({r,c});
    const sv=(r,c,v,t)=>{if(v!==undefined&&v!==null&&v!=='')ws[ec(r,c)]={v,t:t||'s'};};

    /* الأعمدة:
       A(0)=م  B(1)=البند(فاضي)  C(2)=بيان  D(3)=الاسم
       E(4)=تاريخ الصرف  F(5)=سعر الوحدة  G(6)=الكمية  H(7)=اجمالى */
    const NCOLS=8;
    const MIN_ROWS=20;
    const dataRows=Math.max(outEntries.length,MIN_ROWS);
    const DATA_START=5;
    const DATA_END=DATA_START+dataRows-1;
    const SUM_ROW=DATA_END+1;
    const CUST_ROW=DATA_END+2;
    const BAL_ROW=DATA_END+3;
    const SIG_ROW=DATA_END+4;

    /* صف 0: اسم الشركة + عنوان النموذج */
    sv(0,0,company?.name||'');
    sv(0,4,'نموذج  عهدة / مصاريف');

    /* صف 1: صاحب العهدة + اسم المشروع */
    ws[ec(1,0)]={v:'اسم صاحب العهدة:',t:'s'};
    sv(1,2,state.currentUser?.name||'');
    ws[ec(1,3)]={v:'اسم المشروع:',t:'s'};
    sv(1,4,custody?.name||'');

    /* صف 2: مهندس الموقع (فاضي يملأه يدوي) */
    ws[ec(2,0)]={v:'مهندس الموقع:',t:'s'};

    /* صف 3: تاريخ التسوية */
    ws[ec(3,0)]={v:'تاريخ تسوية العهدة:',t:'s'};
    ws[ec(3,2)]={f:'TODAY()',t:'n'};

    /* صف 4: رؤوس الأعمدة */
    ['م','البند','بيان','الاسم','تاريخ الصرف','سعر الوحدة','الكمية','اجمالى']
      .forEach((h,c)=>ws[ec(4,c)]={v:h,t:'s'});

    /* صفوف البيانات */
    for(let i=0;i<dataRows;i++){
      const r=DATA_START+i;
      const er=r+1; /* رقم الصف في Excel (1-indexed) */
      const e=outEntries[i];
      ws[ec(r,0)]={v:i+1,t:'n'};
      /* عمود B (البند): فاضي دايماً حالياً */
      if(e){
        sv(r,2,e.note||'');
        /* D (الاسم): فاضي - يملأه المستخدم يدوياً */
        sv(r,4,e.date?fmtDate(e.date):'');
        if(e.unitPrice!=null&&e.qty!=null){
          ws[ec(r,5)]={v:e.unitPrice,t:'n'};
          ws[ec(r,6)]={v:e.qty,t:'n'};
        }else{
          ws[ec(r,5)]={v:e.amount,t:'n'};
          ws[ec(r,6)]={v:1,t:'n'};
        }
      }
      ws[ec(r,7)]={f:'G'+er+'*F'+er,t:'n'};
    }

    /* صف الإجمالي */
    ws[ec(SUM_ROW,2)]={v:'اجمالى التسوية',t:'s'};
    ws[ec(SUM_ROW,7)]={f:'SUM(H'+(DATA_START+1)+':H'+(DATA_END+1)+')',t:'n'};

    /* صف قيمة العهدة */
    ws[ec(CUST_ROW,2)]={v:'قيمة العهدة',t:'s'};
    ws[ec(CUST_ROW,7)]={v:totalIn,t:'n'};

    /* صف الرصيد */
    ws[ec(BAL_ROW,2)]={v:'رصيد العهدة',t:'s'};
    ws[ec(BAL_ROW,7)]={f:'H'+(CUST_ROW+1)+'-H'+(SUM_ROW+1),t:'n'};

    /* صف التوقيعات */
    ws[ec(SIG_ROW,1)]={v:'المدير المباشر',t:'s'};
    ws[ec(SIG_ROW,2)]={v:'..................................',t:'s'};
    ws[ec(SIG_ROW,3)]={v:'المحاسب المسئول',t:'s'};
    ws[ec(SIG_ROW,4)]={v:'..................................',t:'s'};

    ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:SIG_ROW,c:NCOLS-1}});
    ws['!cols']=[{wch:5},{wch:16},{wch:26},{wch:18},{wch:13},{wch:13},{wch:9},{wch:13}];
    ws['!merges']=[
      {s:{r:0,c:0},e:{r:0,c:2}},
      {s:{r:0,c:4},e:{r:0,c:7}},
    ];
    ws['!views']=[{state:'frozen',xSplit:0,ySplit:5,rightToLeft:true}];

    XLSX.utils.book_append_sheet(wb,ws,'سجل العهدة');

    /* اسم الملف: اسم العهدة + تاريخ التصدير */
    const custodyName=(custody?.name||'عهدة').replace(/[\\/:*?"<>|]/g,'_');
    const exportDate=fmtDate(toISO(new Date())).replace(/\//g,'-');
    const fname=custodyName+'_'+exportDate+'.xlsx';

    /* إضافة RTL حقيقي عبر JSZip */
    const xlsxBuf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
    try{
      const zip=await new JSZip().loadAsync(xlsxBuf);
      const sheetFiles=Object.keys(zip.files).filter(f=>f.startsWith('xl/worksheets/sheet'));
      for(const sf2 of sheetFiles){
        let xml=await zip.files[sf2].async('string');
        xml=xml.replace(/<sheetView([^>]*workbookViewId[^>]*)>/g,(m,attrs)=>{
          if(attrs.includes('rightToLeft'))return m;
          return '<sheetView rightToLeft="1"'+attrs+'>';
        });
        xml=xml.replace(/<sheetView([^>]*workbookViewId[^>]*)\/>/g,(m,attrs)=>{
          if(attrs.includes('rightToLeft'))return m;
          return '<sheetView rightToLeft="1"'+attrs+'/>';
        });
        zip.file(sf2,xml);
      }
      const rtlBuf=await zip.generateAsync({type:'uint8array',compression:'DEFLATE'});
      const blob=new Blob([rtlBuf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=fname;a.click();
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    }catch(zipErr){
      console.error('RTL injection failed',zipErr);
      XLSX.writeFile(wb,fname);
    }
  }catch(err){console.error(err);alert('حصل خطأ في التصدير: '+err.message);}
  finally{if(btn){btn.disabled=false;btn.innerHTML='<span>⬇</span> تصدير Excel';}}
}

async function addProject(name){
  const project={id:uid(),name};
  state.projects.push(project);
  if(!state.currentProjectId){await loadProjectWorkforce(project.id);}
  await sSet('projects:'+state.currentCompanyId,state.projects,true);
  return project;
}

/* ========================= العمالة الأسبوعية ========================= */
function emptyAttFor(){return {days:[false,false,false,false,false,false,false],ot:[0,0,0,0,0,0,0]};}
function getTransport(){return (state.attendance.__transport&&state.attendance.__transport.length===7)?state.attendance.__transport:[0,0,0,0,0,0,0];}
function poolActiveWorkers(){return state.poolWorkers.filter(w=>!w.archived);}
function poolArchivedWorkers(){return state.poolWorkers.filter(w=>w.archived);}
function bookActiveWorkers(){return state.bookWorkers.map(id=>state.poolWorkers.find(w=>w.id===id)).filter(Boolean);}

function workerWeekTotals(worker){
  const att=state.attendance[worker.id]||emptyAttFor();
  const daysWorked=att.days.filter(Boolean).length;
  const otTotal=att.ot.reduce((a,b)=>a+(Number(b)||0),0);
  const hourlyRate=worker.wage/STD_HOURS;
  const total=daysWorked*worker.wage+otTotal*hourlyRate;
  return {daysWorked,otTotal,total,hourlyRate};
}

async function submitPoolWorker(e){
  e.preventDefault();
  const f=e.target;
  const name=f.name.value.trim();if(!name)return;
  const worker={id:uid(),name,type:f.type.value,craft:f.craft.value.trim(),wage:parseFloat(f.wage.value)||0};
  state.poolWorkers.push(worker);
  f.reset();
  renderWorkforceMain();
  await sSet('pool_workers:'+state.currentCompanyId,state.poolWorkers,true);
  /* رفع إثبات الشخصية لو موجود */
  const file=f.idProof?.files[0];
  if(file&&storageReady){
    showToast('جاري رفع إثبات الشخصية...');
    try{
      const url=await uploadFile(file,'id_proofs/'+state.currentCompanyId+'/'+worker.id);
      worker.idProofUrl=url;
      await sSet('pool_workers:'+state.currentCompanyId,state.poolWorkers,true);
      showToast('تم رفع إثبات الشخصية بنجاح ✓');
    }catch(err){showToast('العامل اتضاف لكن فشل رفع الإثبات');}
  }
}

function buildIdProofOverlay(workersList,title){
  /* workersList = [{name, idProofUrl}, ...] */
  const MAX_PER_PAGE=6;
  const pages=[];
  for(let i=0;i<workersList.length;i+=MAX_PER_PAGE)pages.push(workersList.slice(i,i+MAX_PER_PAGE));
  const company=state.companies.find(c=>c.id===state.currentCompanyId);

  const pagesHtml=pages.map((pg,pi)=>`
    <div class="voucher-page${pi>0?' page-break':''}">
      <div class="v-head">
        <div class="v-company">${escapeHtml(company?.name||'')}</div>
        <div class="v-title">${escapeHtml(title)}</div>
      </div>
      <div class="idproof-grid">
        ${pg.map(w=>`
          <div class="idproof-cell">
            <div class="idproof-name">${escapeHtml(w.name)}</div>
            ${w.idProofUrl
              ? (w.idProofUrl.match(/\.(pdf)(\?|$)/i)
                  ? `<div class="idproof-no-img"><a href="${w.idProofUrl}" target="_blank">📄 فتح ملف PDF</a></div>`
                  : `<img class="idproof-img" src="${w.idProofUrl}" alt="${escapeHtml(w.name)}" loading="lazy">`)
              : `<div class="idproof-no-img muted">لا يوجد إثبات شخصية</div>`}
          </div>`).join('')}
      </div>
      ${pages.length>1?`<div class="v-page-num">صفحة ${pi+1} من ${pages.length}</div>`:''}
    </div>`).join('');

  const old=document.getElementById('voucherOverlay');if(old)old.remove();
  const overlay=document.createElement('div');
  overlay.id='voucherOverlay';
  overlay.innerHTML=`<div id="voucherInner">
    ${pagesHtml}
    <div class="voucher-actions">

async function showPaymentVoucher(){
  const book=state.dayBooks.find(b=>b.id===state.currentBookId);
  if(!book){showToast('لا يوجد دفتر مفتوح');return;}
  const company=state.companies.find(c=>c.id===state.currentCompanyId);
  const project=state.projects.find(p=>p.id===state.currentProjectId);
  const workers=bookActiveWorkers();
  if(!workers.length){showToast('أضف عمالاً للدفتر أولاً');return;}

  /* رقم سند تسلسلي مخزّن لكل مشروع */
  const serialKey='serial:'+state.currentCompanyId+':'+state.currentProjectId;
  let serial=(await sGet(serialKey,true))||0;
  serial++;
  await sSet(serialKey,serial,true);
  const serialStr=String(serial).padStart(5,'0');

  const today=fmtDate(toISO(new Date()));
  const dates=weekDates(state.weekStart);
  const weekLabel=fmtDate(dates[0])+' — '+fmtDate(dates[6]);
  const transport=getTransport();
  const transportTotal=transport.reduce((a,b)=>a+(Number(b)||0),0);

  /* بيانات كل عامل */
  const workerRows=workers.map(w=>{
    const att=state.attendance[w.id]||emptyAttFor();
    const days=att.days.filter(Boolean).length;
    const ot=att.ot.reduce((a,b)=>a+(Number(b)||0),0);
    const total=days*w.wage+ot*(w.wage/STD_HOURS);
    return{...w,days,ot,total};
  });
  const grandTotal=workerRows.reduce((a,w)=>a+w.total,0)+transportTotal;

  /* تقسيم إلى صفحات بحد أقصى 7 عمال */
  const MAX=7;
  const pages=[];

    const isLast=pi===pages.length-1;
    const rows=pg.map((w,i)=>`<tr>
      <td class="tc" style="width:4%">${pi*MAX+i+1}</td>
      <td style="width:20%">${escapeHtml(w.name)}</td>
      <td class="tc" style="width:9%">${w.type}</td>
      <td class="tc" style="width:10%">${escapeHtml(w.craft||'-')}</td>
      <td class="tc" style="width:10%">${fmt(w.wage)}</td>
      <td class="tc" style="width:7%">${w.days}</td>
      <td class="tc" style="width:8%">${w.ot>0?fmt(w.ot):'-'}</td>
      <td class="tc" style="width:10%;font-weight:700;">${fmt(w.total)}</td>
      <td style="width:22%;border-bottom:1px dashed #aaa;"></td>
    </tr>`).join('');

    /* صفوف فارغة لتثبيت ارتفاع الجدول */
    const empty=Array(MAX-pg.length).fill(`<tr>${Array(9).fill('<td style="height:32px;"></td>').join('')}</tr>`).join('');

    return`<div class="voucher-page${pi>0?' page-break':''}">
      <div class="v-head">
        <div class="v-company">${escapeHtml(company?.name||'سند صرف')}</div>
        <div class="v-title">سند صرف أجور العمالة</div>
        ${metaHtml(serialStr)}
      </div>
      <table class="v-table">
        <thead><tr>
          <th>م</th><th>الاسم</th><th>النوع</th><th>الصنعة</th>
          <th>اليومية</th><th>أيام</th><th>ساعات إضافي</th>
          <th>الإجمالي المستحق</th><th>التوقيع</th>
        </tr></thead>
        <tbody>
          ${rows}${empty}
          ${isLast&&transportTotal>0?`<tr class="v-transport-row">
            <td colspan="7" style="text-align:right;padding-right:8px;">إجمالي الانتقالات اليومية</td>
            <td class="tc">${fmt(transportTotal)}</td><td></td>
          </tr>`:''}
          ${isLast?`<tr class="v-total-row">
            <td colspan="7" style="text-align:right;padding-right:8px;">الإجمالي الكلي</td>
            <td class="tc">${fmt(grandTotal)}</td><td></td>
          </tr>`:''}
        </tbody>
      </table>
      ${isLast?`<div class="v-footer">
        <div class="v-sign-box"><div class="v-sign-line"></div><div class="v-sign-label">توقيع مهندس المشروع</div></div>
        <div class="v-sign-box"><div class="v-sign-line"></div><div class="v-sign-label">توقيع المحاسب</div></div>
        <div class="v-sign-box"><div class="v-sign-line"></div><div class="v-sign-label">اعتماد المدير العام</div></div>
      </div>`:''}
      ${pages.length>1?`<div class="v-page-num">صفحة ${pi+1} من ${pages.length} — رقم السند: ${serialStr}</div>`:''}
    </div>`;
  }).join('');

  const old=document.getElementById('voucherOverlay');
  if(old)old.remove();
  const overlay=document.createElement('div');
  overlay.id='voucherOverlay';
  overlay.innerHTML=`<div id="voucherInner">
    ${pagesHtml}
    <div class="voucher-actions">
      <button class="voucher-print-btn" id="voucherPrintBtn">🖨 طباعة</button>

      <button class="voucher-close-btn" id="voucherCloseBtn">✕ إغلاق</button>

  document.getElementById('voucherCloseBtn').addEventListener('click',()=>overlay.remove());

function renderAttendanceTable(days){
  const book=state.dayBooks.find(b=>b.id===state.currentBookId);
  if(!book)return;
  if(!days)days=getDaysInRange(book.startDate,book.endDate);
  const body=document.getElementById('attBody');
  const foot=document.getElementById('attFoot');
  if(!body||!foot)return;
  const workers=bookActiveWorkers();
  let footDays=0,footOt=0,footTotal=0;

  const workerRows=workers.map(w=>{
    const {daysWorked,otTotal,total}=workerBookTotals(w,days);
    footDays+=daysWorked;footOt+=otTotal;footTotal+=total;
    const dayCells=days.map(date=>{
      const d=getWorkerDay(w.id,date);
      const present=!!d.present;
      const ot=d.ot||'';
      return `<td class="day-cell">
        <span class="day-stamp${present?' present':''}" data-worker="${w.id}" data-date="${date}">${present?'✓':''}</span>
        <input type="number" min="0" step="0.5" class="ot-input" placeholder="ساعات" value="${ot===0||ot===''?'':ot}" data-worker="${w.id}" data-otdate="${date}">
      </td>`;
    }).join('');
    return `<tr>
      <td style="position:sticky;right:0;background:var(--paper);z-index:1;">${escapeHtml(w.name)}${w.craft?` <span class="muted">(${escapeHtml(w.craft)})</span>`:''}</td>
      <td class="muted">${w.type}</td><td class="num">${fmt(w.wage)}</td>
      ${dayCells}
      <td class="num">${daysWorked}</td><td class="num">${fmt(otTotal)}</td>
      <td class="num total-col">${fmt(total)}</td>
    </tr>`;
  }).join('');

  const transportTotal=days.reduce((a,d)=>a+getTransportForDate(d),0);
  const transportRow=`<tr class="transport-row">
    <td colspan="3" style="text-align:right;"><strong>إجمالي الانتقالات (لكل الفريق في اليوم)</strong></td>
    ${days.map(date=>{
      const v=getTransportForDate(date);
      return `<td class="day-cell"><input type="number" min="0" step="0.5" class="transport-input" placeholder="0" value="${v||''}" data-transportdate="${date}"></td>`;
    }).join('')}
    <td></td><td></td><td class="num total-col">${fmt(transportTotal)}</td>
  </tr>`;

  body.innerHTML=workers.length
    ? workerRows+transportRow
    : `<tr><td colspan="${3+days.length+3}" class="muted" style="text-align:center;padding:14px;">أضف عمالاً للدفتر من الكارت فوق لبدء التحضير.</td></tr>`+transportRow;

  foot.innerHTML=`<td colspan="3">الإجمالي العام</td>${days.map(()=>'<td></td>').join('')}<td class="num">${footDays}</td><td class="num">${fmt(footOt)}</td><td class="num">${fmt(footTotal+transportTotal)}</td>`;

  /* ربط الأحداث */
  body.querySelectorAll('.day-stamp').forEach(stamp=>{
    stamp.addEventListener('click',async()=>{
      const wid=stamp.dataset.worker,date=stamp.dataset.date;
      const cur=getWorkerDay(wid,date);
      setWorkerDay(wid,date,{...cur,present:!cur.present});
      renderAttendanceTable(days);
      await saveAttendance();
    });
  });
  body.querySelectorAll('.ot-input').forEach(inp=>{
    inp.addEventListener('change',async()=>{
      const wid=inp.dataset.worker,date=inp.dataset.otdate;
      const cur=getWorkerDay(wid,date);
      setWorkerDay(wid,date,{...cur,ot:parseFloat(inp.value)||0});
      renderAttendanceTable(days);
      await saveAttendance();
    });
  });
  body.querySelectorAll('.transport-input').forEach(inp=>{
    inp.addEventListener('change',async()=>{
      const date=inp.dataset.transportdate;
      if(!state.attendance.__transport)state.attendance.__transport={};
      state.attendance.__transport[date]=parseFloat(inp.value)||0;
      renderAttendanceTable(days);
      await saveAttendance();
    });
  });
}

async function exportBookReport(){
  const btn=document.getElementById('exportBookBtn');
  btn.disabled=true;const oldText=btn.innerHTML;btn.innerHTML='<span>...</span> جاري التصدير';
  try{
    const company=state.companies.find(c=>c.id===state.currentCompanyId);
    const project=state.projects.find(p=>p.id===state.currentProjectId);
    const book=state.dayBooks.find(b=>b.id===state.currentBookId);
    const wb=XLSX.utils.book_new();
    const workers=bookActiveWorkers();

    /* تصدير الأسبوع الحالي فقط */
    const wk=state.weekStart;
    const wdata=state.attendance;
    const dates=weekDates(wk);
    const transport=(wdata.__transport&&wdata.__transport.length===7)?wdata.__transport:[0,0,0,0,0,0,0];

    const ws={};
    const ec=(r,c)=>XLSX.utils.encode_cell({r,c});
    const sv=(r,c,v,t)=>{if(v!==undefined&&v!=='')ws[ec(r,c)]={v,t:t||'s'};};
    const sf=(r,c,f)=>{ws[ec(r,c)]={f,t:'n'};};

    const NCOLS=15;
    const DCols=['B','C','D','E','F','G','H'];

    /* صف 0: عنوان */
    const projName=project?project.name:'';
    const bookName=book?book.name||'':'';
    const title='مشروع : '+projName+'\n'+bookName+
      '\nالأسبوع من '+fmtDate(dates[0])+' إلى '+fmtDate(dates[6]);
    ws[ec(0,0)]={v:title,t:'s'};
    ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:NCOLS-1}}];

    /* صف 1: رؤوس الأعمدة */
    ['العامل',...DAYS.map(d=>d.label),'المهنة','الوصف','اليومية','عدد أيام العمل','عمل إضافي','جنيه / ساعة','إجمالي اليوميات']
      .forEach((h,c)=>sv(1,c,h));

    /* صف 2: التواريخ + وحدات */
    sv(2,0,'التاريخ');
    dates.forEach((d,i)=>sv(2,i+1,fmtDate(d)));
    sv(2,10,'جنيه');sv(2,12,'ساعة');sv(2,14,'جنيه');

    const DATA_START=3;
    let r=DATA_START;
    workers.forEach(w=>{
      const att=wdata[w.id]||emptyAttFor();
      const er=r+1;
      sv(r,0,w.name);
      for(let d=0;d<7;d++){if(att.days[d])ws[ec(r,d+1)]={v:1,t:'n'};}
      sv(r,8,w.craft||'');
      sv(r,9,w.type||'');
      sv(r,10,w.wage,'n');
      sf(r,11,DCols.map(col=>col+er).join('+'));
      const otTotal=att.ot.reduce((a,b)=>a+(Number(b)||0),0);
      if(otTotal>0)sv(r,12,otTotal,'n');
      sf(r,13,'K'+er+'/'+STD_HOURS);
      sf(r,14,'K'+er+'*L'+er+'+(M'+er+'*N'+er+')');
      r++;
    });

    /* صف الانتقالات */
    const transER=r+1;
    sv(r,0,'الانتقالات');
    for(let d=0;d<7;d++){if(transport[d])sv(r,d+1,transport[d],'n');}
    sf(r,14,'SUM(B'+transER+':H'+transER+')');
    r++;

    /* صف الإجمالي */
    sv(r,0,'الإجمالي الكلي');
    sf(r,14,'SUM(O'+(DATA_START+1)+':O'+r+')');
    r++;

    ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:r-1,c:NCOLS-1}});
    ws['!cols']=[
      {wch:20},{wch:7},{wch:7},{wch:8},{wch:9},{wch:8},{wch:8},{wch:7},
      {wch:12},{wch:10},{wch:10},{wch:12},{wch:10},{wch:13},{wch:15}
    ];
    ws['!views']=[{state:'frozen',xSplit:1,ySplit:3,rightToLeft:true}];
    XLSX.utils.book_append_sheet(wb,ws,'اليوميات');

    /* اسم الملف: دفتر يوميات - الموقع - من ... إلى ... */
    const siteName=(project?project.name:'موقع').replace(/[\\/:*?"<>|]/g,'_');
    const fromDate=fmtDate(dates[0]).replace(/\//g,'-');
    const toDate=fmtDate(dates[6]).replace(/\//g,'-');
    const fname='دفتر يوميات - '+siteName+' - من '+fromDate+' إلى '+toDate+'.xlsx';

    /* إضافة RTL حقيقي عبر JSZip */
    const xlsxBuf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
    try{
      const zip=await new JSZip().loadAsync(xlsxBuf);
      const sheetFiles=Object.keys(zip.files).filter(f=>f.startsWith('xl/worksheets/sheet'));
      for(const sf2 of sheetFiles){
        let xml=await zip.files[sf2].async('string');
        xml=xml.replace(/<sheetView([^>]*workbookViewId[^>]*)>/g,(m,attrs)=>{
          if(attrs.includes('rightToLeft'))return m;
          return '<sheetView rightToLeft="1"'+attrs+'>';
        });
        xml=xml.replace(/<sheetView([^>]*workbookViewId[^>]*)\/>/g,(m,attrs)=>{
          if(attrs.includes('rightToLeft'))return m;
          return '<sheetView rightToLeft="1"'+attrs+'/>';
        });
        zip.file(sf2,xml);
      }
      const rtlBuf=await zip.generateAsync({type:'uint8array',compression:'DEFLATE'});
      const blob=new Blob([rtlBuf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=fname;a.click();
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    }catch(zipErr){
      console.error('RTL injection failed, falling back',zipErr);
      XLSX.writeFile(wb,fname);
    }
  }catch(err){console.error(err);alert('حصل خطأ في التصدير: '+err.message);}
  finally{btn.disabled=false;btn.innerHTML=oldText;}
}
